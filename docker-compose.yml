version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: freshdash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: freshdash
      POSTGRES_PASSWORD: freshdash123
      POSTGRES_DB: freshdash
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshdash"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: freshdash-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 可选：MinIO 对象存储（用于图片上传）
  minio:
    image: minio/minio:latest
    container_name: freshdash-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: freshdash
      MINIO_ROOT_PASSWORD: freshdash123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  redis_data:
  minio_data:
